<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quit Smoking Counter</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f7f5;--card:#ffffff;--text:#1b2a24;--muted:#5d6f66;--accent:#1f8a5b;--accent-text:#ffffff;--border:#dbe5df;--track:#dbe5df;--danger:#b3402f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a15;--card:#18251e;--text:#e8f1ec;--muted:#9bb0a5;--accent:#3fbf86;--accent-text:#08150f;--border:#27382f;--track:#27382f;--danger:#e0806f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a15;--card:#18251e;--text:#e8f1ec;--muted:#9bb0a5;--accent:#3fbf86;--accent-text:#08150f;--border:#27382f;--track:#27382f;--danger:#e0806f;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:14px}
h1{margin:12px 0 0;font-size:28px}
.center{text-align:center}
.big{font-size:88px;font-weight:700;line-height:1;margin:6px 0 0;color:var(--accent)}
.sub{color:var(--muted);margin:0}
.clock{font-size:20px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.row{display:flex;gap:10px}
.row .card{flex:1;text-align:center;padding:12px 8px}
.stat{font-size:20px;font-weight:700}
.small{font-size:12px;color:var(--muted)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)}
button{font:inherit;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;width:100%}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent);width:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay .card{max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px}
.timer{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.hidden{display:none}
ul{margin:0;padding-left:20px}
</style>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f8a5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  var KEY="quit-counter-v1", DAY=86400000;
  var s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ s=null; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} }
  var app=document.getElementById("app");
  var timerId=null, cravingId=null;

  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function setup(){
    clearInterval(timerId);
    app.innerHTML=
      '<h1>Quit Smoking</h1>'+
      '<p class="sub">Tell me a little so I can track your progress.</p>'+
      '<div><label>Cigarettes per day</label><input id="perDay" type="number" inputmode="numeric" value="10"></div>'+
      '<div><label>Cigarettes in a pack</label><input id="packSize" type="number" inputmode="numeric" value="20"></div>'+
      '<div><label>Price of a pack (Rs)</label><input id="price" type="number" inputmode="decimal" placeholder="0"></div>'+
      '<div><label>Why do you want to quit?</label><input id="reason" type="text" placeholder="My health, my family…"></div>'+
      '<button class="primary" id="start">Start my smoke-free journey</button>';
    document.getElementById("start").onclick=function(){
      s={
        quitTime:Date.now(), bestMs:0,
        perDay:parseInt(document.getElementById("perDay").value)||10,
        packSize:Math.max(1,parseInt(document.getElementById("packSize").value)||20),
        price:parseFloat(document.getElementById("price").value)||0,
        reason:document.getElementById("reason").value.trim()
      };
      save(); dashboard();
    };
  }

  var milestones=[1,3,7,14,30,60,90,180,365];

  function dashboard(){
    app.innerHTML=
      '<div class="center"><p class="sub" style="margin-top:14px">Smoke-free for</p>'+
      '<p class="big" id="days">0</p><p class="sub" id="dlabel">days</p>'+
      '<p class="clock" id="clock"></p></div>'+
      (s.reason?'<div class="card"><strong>My reason</strong><div>'+esc(s.reason)+'</div></div>':'')+
      '<div class="row">'+
        '<div class="card"><div class="stat" id="saved"></div><div class="small">saved</div></div>'+
        '<div class="card"><div class="stat" id="skipped"></div><div class="small">cigarettes skipped</div></div>'+
        '<div class="card"><div class="stat" id="best"></div><div class="small">best streak (days)</div></div>'+
      '</div>'+
      '<div class="card"><strong id="mtitle"></strong><div class="bar"><div id="mbar"></div></div></div>'+
      '<button class="primary" id="craving">I have a craving</button>'+
      '<button class="danger" id="slip">I smoked (restart counter)</button>'+
      '<button id="reset">Change my settings</button>';

    document.getElementById("craving").onclick=craving;
    document.getElementById("slip").onclick=slip;
    document.getElementById("reset").onclick=function(){ if(confirm("This clears all your data and starts over. Continue?")){ s=null; try{localStorage.removeItem(KEY);}catch(e){} setup(); } };
    tick(); clearInterval(timerId); timerId=setInterval(tick,1000);
  }

  function pad(n){ return (n<10?"0":"")+n; }

  function tick(){
    var el=Math.max(0,Date.now()-s.quitTime);
    var days=Math.floor(el/DAY), h=Math.floor(el/3600000)%24, m=Math.floor(el/60000)%60, sec=Math.floor(el/1000)%60;
    var exact=el/DAY;
    document.getElementById("days").textContent=days;
    document.getElementById("dlabel").textContent=days===1?"day":"days";
    document.getElementById("clock").textContent=pad(h)+" h  "+pad(m)+" m  "+pad(sec)+" s";
    document.getElementById("saved").textContent="Rs "+Math.round(exact*s.perDay/s.packSize*s.price).toLocaleString();
    document.getElementById("skipped").textContent=Math.floor(exact*s.perDay);
    document.getElementById("best").textContent=Math.floor(Math.max(s.bestMs,el)/DAY);
    var next=null,prev=0;
    for(var i=0;i<milestones.length;i++){ if(milestones[i]>days){ next=milestones[i]; break; } prev=milestones[i]; }
    if(next){
      document.getElementById("mtitle").textContent="Next milestone: "+next+" days";
      document.getElementById("mbar").style.width=Math.min(100,Math.max(0,(exact-prev)/(next-prev)*100))+"%";
    } else {
      document.getElementById("mtitle").textContent="You reached every milestone. Amazing!";
      document.getElementById("mbar").style.width="100%";
    }
  }

  function modal(html){
    var o=document.createElement("div"); o.className="overlay"; o.innerHTML='<div class="card">'+html+'</div>';
    document.body.appendChild(o); return o;
  }

  function slip(){
    var o=modal('<strong>Restart the counter?</strong><div class="sub">A slip is not failure. Your best streak is saved and you can start again right now.</div>'+
      '<button class="primary" id="yes">Restart</button><button id="no">Cancel</button>');
    o.querySelector("#no").onclick=function(){ o.remove(); };
    o.querySelector("#yes").onclick=function(){
      s.bestMs=Math.max(s.bestMs,Date.now()-s.quitTime); s.quitTime=Date.now(); save(); o.remove(); tick();
    };
  }

  function craving(){
    var left=600;
    var o=modal('<strong>Cravings pass. Stay with it.</strong><div class="timer" id="ct"></div><div id="done" class="hidden"><strong>You made it through. Well done!</strong></div>'+
      '<ul><li>Drink a full glass of water slowly.</li><li>Take 10 slow, deep breaths.</li><li>Walk around or stretch for a few minutes.</li><li>Brush your teeth or chew gum.</li><li>Message a friend or do something with your hands.</li></ul>'+
      '<button class="primary" id="close">Close</button>');
    function draw(){ o.querySelector("#ct").textContent=Math.floor(left/60)+":"+pad(left%60); if(left<=0){ o.querySelector("#done").classList.remove("hidden"); } }
    draw();
    cravingId=setInterval(function(){ if(left>0){ left--; draw(); } else clearInterval(cravingId); },1000);
    o.querySelector("#close").onclick=function(){ clearInterval(cravingId); o.remove(); };
  }

  if(s&&s.quitTime) dashboard(); else setup();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(function (error) {
        console.error("Service worker registration failed:", error);
      });
  });
}
</script>

</body>
</html>
